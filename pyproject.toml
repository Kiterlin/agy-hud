[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-hud"
version = "0.1.0"
description = "A claude-hud inspired real-time status line HUD plugin for Antigravity CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Kiterlin" }]
keywords = ["antigravity", "agy", "statusline", "hud", "cli", "plugin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/Kiterlin/agy-hud"
Repository = "https://github.com/Kiterlin/agy-hud"
Issues = "https://github.com/Kiterlin/agy-hud/issues"

[project.scripts]
agy-hud = "agy_hud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
