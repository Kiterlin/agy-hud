  <text x="32" y="232" class="mono" xml:space="preserve"><tspan fill="#EED49F">◐</tspan><tspan fill="#C6A0F6"> Codebase Researcher</tspan><tspan fill="#A5ADCB"> [flash] (14s)</tspan></text>
