<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 278" width="920" height="278" role="img" aria-label="AGY HUD Dark Preview (Catppuccin Macchiato)">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13.5px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .bold { font-weight: 700; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Terminal window (Catppuccin Macchiato #24273A) -->
  <rect x="12" y="10" width="896" height="254" rx="12" fill="#24273A" stroke="#363A4F" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Titlebar -->
  <path d="M 12 22 Q 12 10 24 10 L 896 10 Q 908 10 908 22 L 908 42 L 12 42 Z" fill="#1E2030"/>
  <circle cx="32" cy="26" r="5.5" fill="#ED8796"/>
  <circle cx="50" cy="26" r="5.5" fill="#EED49F"/>
  <circle cx="68" cy="26" r="5.5" fill="#A6DA95"/>
  <text x="460" y="30" text-anchor="middle" fill="#A5ADCB" class="title">agy — Antigravity CLI · Catppuccin Macchiato (Dark)</text>

