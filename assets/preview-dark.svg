  <text x="32" y="84" class="mono" fill="#C6A0F6">&gt; </text>
  <text x="50" y="84" class="mono" fill="#CAD3F5">Refactor the status line renderer and add live subagent tracking</text>
  <rect x="572" y="71" width="8" height="16" fill="#C6A0F6" opacity="0.85"/>
  <line x1="28" y1="98" x2="892" y2="98" stroke="#363A4F" stroke-width="1"/>

  <!-- Line 1: Model + Effort | Project + Git | Title -->
  <text x="32" y="124" class="mono" xml:space="preserve"><tspan fill="#C6A0F6" class="bold">[Gemini 4 Neon ◕ xhigh]</tspan><tspan fill="#6E738D"> │ </tspan><tspan fill="#8AADF4" class="bold">agy-hud</tspan><tspan fill="#CAD3F5"> </tspan><tspan fill="#B7BDF8">git:(</tspan><tspan fill="#8BD5CA">main</tspan><tspan fill="#F5A97F" class="bold">*</tspan><tspan fill="#8BD5CA"> ↑1</tspan><tspan fill="#B7BDF8">)</tspan><tspan fill="#6E738D"> │ </tspan><tspan fill="#A5ADCB">Build agy-hud plugin</tspan></text>

  <!-- Line 2: Context bar (green) -->
  <text x="32" y="150" class="mono" xml:space="preserve"><tspan fill="#A5ADCB">Context </tspan><tspan fill="#A6DA95">██</tspan><tspan fill="#494D64">░░░░░░░░</tspan><tspan fill="#A6DA95"> 18%</tspan><tspan fill="#A5ADCB"> (189k/1M)</tspan><tspan fill="#6E738D"> · </tspan><tspan fill="#8BD5CA">cache 92%</tspan><tspan fill="#6E738D"> · </tspan><tspan fill="#A5ADCB">tok 214k</tspan></text>

  <!-- Line 3: Quota bars (sapphire, column aligned!) -->
  <text x="32" y="176" class="mono" xml:space="preserve"><tspan fill="#A5ADCB">5h      </tspan><tspan fill="#7DC4E4">█████████</tspan><tspan fill="#494D64">░</tspan><tspan fill="#7DC4E4"> 85%</tspan><tspan fill="#A5ADCB"> (3h 10m)</tspan><tspan fill="#6E738D"> │ </tspan><tspan fill="#A5ADCB">7d </tspan><tspan fill="#7DC4E4">███████</tspan><tspan fill="#494D64">░░░</tspan><tspan fill="#7DC4E4"> 68%</tspan><tspan fill="#A5ADCB"> (5d 23h)</tspan></text>

  <!-- Line 4: Tools activity -->
  <text x="32" y="206" class="mono" xml:space="preserve"><tspan fill="#EED49F">◐</tspan><tspan fill="#7DC4E4"> run_command</tspan><tspan fill="#A5ADCB">: python3 -m unittest</tspan><tspan fill="#6E738D"> | </tspan><tspan fill="#A6DA95">✓</tspan><tspan fill="#CAD3F5"> read_file </tspan><tspan fill="#A5ADCB">×12</tspan><tspan fill="#6E738D"> | </tspan><tspan fill="#A6DA95">✓</tspan><tspan fill="#CAD3F5"> edit_file </tspan><tspan fill="#A5ADCB">×5</tspan><tspan fill="#6E738D"> | </tspan><tspan fill="#A6DA95">✓</tspan><tspan fill="#CAD3F5"> search_web </tspan><tspan fill="#A5ADCB">×2</tspan></text>

